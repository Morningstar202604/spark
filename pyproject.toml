[project]
name = "spark-agent"
version = "0.8.0"
description = "Spark Agent —— 本地 AI 编程助手（单事件循环 / 审批门 / MCP / TUI / 单一前端）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
extras = ["tiktoken>=0.7", "trafilatura>=1.8", "mcp>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mcp>=1.0", "textual>=0.60"]

[project.scripts]
spark2 = "spark2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spark2*"]

[tool.setuptools.package-data]
spark2 = ["web/index.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
