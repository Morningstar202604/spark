[project]
name = "spark-agent"
version = "0.9.0"
description = "Local-first AI coding agent. Approval-gated writes and commands, local memory, MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",   # [standard] 含 websockets：Web 终端(WS)依赖，缺了会 404
    "httpx>=0.27",
    "typer>=0.12",
    "tomlkit>=0.12",
    "pydantic-settings>=2.0",
    "openai>=1.40",              # 官方 OpenAI SDK：流式解析 + tool_call 拼装 + 重试
    "tiktoken>=0.7",             # token 估算（精确）
    "trafilatura>=1.8",          # 网页正文提取（替代正则 <! 清洗）
    "tree-sitter>=0.25",         # AST 解析核心
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-cpp>=0.23",    # C / C++ / ObjC 共享
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "langgraph>=1.0",           # StateGraph 编排引擎（AgentLoop 内部节点图）
    "semantic-router>=0.1.0",   # 嵌入向量语义路由（快/强模型智能选择）；未安装时退回关键词匹配
]

[project.optional-dependencies]
extras = ["mcp>=1.0,<2", "textual>=0.60"]
office = ["python-docx>=1.1", "openpyxl>=3.1", "pypdf>=4.0"]  # 办公文档工具（docx/xlsx/pdf）
memory = ["jieba>=0.42", "mem0ai>=2.0", "chromadb>=0.5"]  # 中文分词 + mem0 向量记忆后端
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "mypy>=1.10", "bandit>=1.7", "mcp>=1.0,<2", "textual>=0.60", "ruff>=0.8", "jieba>=0.42"]

[project.scripts]
spark = "spark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
# 首次部署或换机器时如遇 "No matching distribution found for fastapi" 之类报错，
# 多半是系统 pip 太旧（<23.2），先执行 `python -m pip install --upgrade pip` 再装。

[tool.setuptools.packages.find]
include = ["spark*"]

[tool.setuptools.package-data]
spark = ["web/**/*"]   # 含 css/js/vendor/NOTICE：缺了前端资源，pip 安装后页面会 404

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["spark/web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # E501 行宽已由 line-length 控制；B008 为 FastAPI Depends 惯例，非缺陷

[tool.mypy]
ignore_missing_imports = true
# 针对 PTY/TUI/terminal 平台相关库缺少类型桩的已知噪音
[[tool.mypy.overrides]]
module = [
    "ptyprocess.*",
    "pywinpty.*",
    "textual.*",
    "tree_sitter.*",
    "trafilatura.*",
    "openpyxl.*",
    "docx.*",
    "pypdf.*",
]
ignore_errors = true
