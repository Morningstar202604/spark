[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-agent"
version = "0.1.0"
description = "Spark [Ember] — local-first coding agent with a Codex-style loop"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "agent", "coding", "local-first", "llm", "chatbot"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "chromadb>=0.6,<1.0",
    "litellm>=1.0,<2.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-llms-openai-like>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.3,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "textual>=0.80,<1.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
]

[project.scripts]
spark = "spark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spark = ["prompts/*.md", "web/*.html", "web/dist/*", "web/dist/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
