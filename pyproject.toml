[project]
name = "spark-agent"
version = "0.9.0"
description = "Spark Agent —— 本地 AI 编程助手（单事件循环 / 审批门 / MCP / TUI / 单一前端）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",   # [standard] 含 websockets：Web 终端(WS)依赖，缺了会 404
    "httpx>=0.27",
    "typer>=0.12",
    "tomlkit>=0.12",
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
extras = ["tiktoken>=0.7", "trafilatura>=1.8", "mcp>=1.0,<2", "textual>=0.60"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mcp>=1.0,<2", "textual>=0.60", "ruff>=0.8"]

[project.scripts]
spark2 = "spark2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spark2*"]

[tool.setuptools.package-data]
spark2 = ["web/**/*"]   # 含 css/js/vendor/NOTICE：缺了前端资源，pip 安装后页面会 404

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["spark2/web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # E501 行宽已由 line-length 控制；B008 为 FastAPI Depends 惯例，非缺陷
