name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check spark tests
      - name: Type check (mypy)
        run: mypy spark --ignore-missing-imports
      - name: Security scan (bandit)
        run: bandit -r spark -ll -ii -c bandit.yaml

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check spark tests
      - name: Test (pytest + coverage)
        run: |
          python -m pytest -q --cov=spark --cov-report=term-missing --cov-fail-under=65

