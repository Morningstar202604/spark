name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/spark tests scripts
      - name: Type check (mypy)
        run: mypy src/spark --ignore-missing-imports
      - name: Import layering (import-linter)
        run: lint-imports
      - name: Security scan (bandit)
        run: bandit -r src/spark -ll -ii -c bandit.yaml
      - name: OpenAPI snapshot is current
        # The frontend types in web/src/api/schema.ts are generated from this
        # snapshot; a stale file means the UI silently drifts from the API.
        run: |
          pip install -e ".[openapi]"
          python scripts/export_openapi.py --check

  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported platforms are first-class: the same code must pass on
        # Linux and Windows (different shell, path semantics, process model).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/spark tests scripts
      - name: Test (pytest + coverage)
        run: |
          python -m pytest -q --cov=spark --cov-report=term-missing --cov-fail-under=65

  windows-checkout:
    # Guards the failure mode found in review: a Windows-reserved filename in the
    # tree makes `git clone` unusable on Windows even though Linux is fine.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Windows-reserved paths
        shell: pwsh
        run: |
          $reserved = 'CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9]'
          $bad = git ls-files | Where-Object {
            $leaf = [System.IO.Path]::GetFileNameWithoutExtension($_)
            $leaf -match "^($reserved)$"
          }
          if ($bad) {
            Write-Error "Windows-reserved filenames in tree: $bad"
            exit 1
          }
          Write-Host "no reserved filenames"

