# PyPI 发布（Trusted Publishing / OIDC）——首次使用前需在 PyPI 侧完成一次性配置：
#   pypi.org → spark-agent 项目 → Publishing → 声明 Trusted Publisher：
#     owner=badhope  repo=spark  workflow=publish.yml  environment=pypi
# 之后手动触发本工作流即可（或 push tag v* 自动触发）。
name: publish
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build sdist & wheel
        run: |
          pip install build -i https://mirrors.aliyun.com/pypi/simple/
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing（若已在 PyPI 配置）
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Skip if version already on PyPI
        id: vercheck
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -sf https://pypi.org/pypi/spark-agent/json | python3 -c "
import json,sys
sys.exit(0 if json.load(sys.stdin).get('info',{}).get('version')=='$VER' else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version $VER already on PyPI — skip publish (本地已发布)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version $VER not on PyPI — will publish"
          fi
      - name: Publish to PyPI
        if: steps.vercheck.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # API token 发布（PYPI_API_TOKEN 已配置为仓库 Secret）；
          # 若后续配置了 Trusted Publishing，可移除 password 改走 OIDC
          password: ${{ secrets.PYPI_API_TOKEN }}
