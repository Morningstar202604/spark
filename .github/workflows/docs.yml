name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "src/spark/**", "README*.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install -e . -i https://mirrors.aliyun.com/pypi/simple/
          pip install mkdocs-material mkdocstrings[python] -i https://mirrors.aliyun.com/pypi/simple/
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --no-history
