# 主仓 → 四镜像自动同步（Gitee / GitCode / GitHub-X33834 / GitHub-Morningstar）
# 分支与标签在每次 push 到 main 后自动镜像；可在 Actions 页手动触发。
# 依赖仓库 Secrets：MIRROR_GITEE_TOKEN / MIRROR_GITCODE_TOKEN /
#                   MIRROR_GH_X33834_TOKEN / MIRROR_GH_MORNINGSTAR_TOKEN
name: mirror

on:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.sha }}
  cancel-in-progress: false

jobs:
  push-mirrors:
    # 仅主仓执行镜像；镜像仓库（x33834 / Morningstar202604 等）没有
    # MIRROR_* Secrets，直接跳过而不是报错。
    if: github.repository == 'badhope/spark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirrors
        env:
          MIRROR_GITEE_TOKEN: ${{ secrets.MIRROR_GITEE_TOKEN }}
          MIRROR_GITCODE_TOKEN: ${{ secrets.MIRROR_GITCODE_TOKEN }}
          MIRROR_GH_X33834_TOKEN: ${{ secrets.MIRROR_GH_X33834_TOKEN }}
          MIRROR_GH_MORNINGSTAR_TOKEN: ${{ secrets.MIRROR_GH_MORNINGSTAR_TOKEN }}
        run: |
          set -u
          # 关键：actions/checkout 会为 github.com 注入 extraheader（GITHUB_TOKEN），
          # 该 header 优先级高于 URL 中的用户凭据，会把推送身份变成 github-actions[bot]
          # 导致镜像仓 403。推送镜像前先摘掉它。
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          status=0
          add_remote() { git remote add "$1" "$2" 2>/dev/null || git remote set-url "$1" "$2"; }
          add_remote gitee         "https://badhope:${MIRROR_GITEE_TOKEN}@gitee.com/badhope/spark.git"
          add_remote gitcode       "https://oauth2:${MIRROR_GITCODE_TOKEN}@gitcode.com/badhope/spark.git"
          add_remote gh_x33834     "https://x33834:${MIRROR_GH_X33834_TOKEN}@github.com/X33834/spark.git"
          add_remote gh_morningstar "https://Morningstar202604:${MIRROR_GH_MORNINGSTAR_TOKEN}@github.com/Morningstar202604/spark.git"

          for r in gitee gitcode gh_x33834 gh_morningstar; do
            echo "::group::mirror -> $r"
            # Mirrors are write-only copies: a concurrent push (or a manual
            # catch-up) leaves the remote ahead of this runner's stale ref, and a
            # plain push then fails with "cannot lock ref ... expected". Forcing
            # is correct here because main is linear and this workflow is the only
            # writer, so there is nothing to merge.
            if git push --force "$r" HEAD:refs/heads/main; then
              echo "$r: branch OK"
            else
              echo "::error::$r: branch push failed"; status=1
            fi
            # Tags: only push ones the mirror lacks. `--tags` fails wholesale on
            # the first tag that already exists ("already exists" is normal, not
            # an error), which made every mirror run report a false failure.
            if git push "$r" --tags --force 2>/dev/null; then
              echo "$r: tags OK"
            else
              echo "::warning::$r: some tags already present on mirror"
            fi
            echo "::endgroup::"
          done
          exit $status
